<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Budgets — FinTrack</title>
    <h:outputStylesheet library="css" name="styles.css" />
</h:head>
<h:body>

    <nav class="navbar">
        <div class="nav-brand">💰 FinTrack</div>
        <div class="nav-links">
            <h:form styleClass="nav-form">
                <h:commandLink value="Home" action="index" styleClass="nav-link" />
                <h:commandLink value="Transactions" action="transactionList" styleClass="nav-link" />
                <h:commandLink value="+ Add Budget" action="budgetForm" styleClass="nav-link nav-cta" />
            </h:form>
        </div>
    </nav>

    <div class="page-header">
        <h2>Budgets</h2>
        <h:form>
            <h:commandButton value="+ Add New" action="#{budgetBean.cancelEdit}" immediate="true" styleClass="home-btn" />
        </h:form>
    </div>

    <div class="table-wrapper">
        <h:form>
            <h:dataTable value="#{budgetBean.budgets}" var="b" styleClass="product-table">
                <h:column>
                    <f:facet name="header">Category</f:facet>
                    #{b.category}
                </h:column>
                <h:column>
                    <f:facet name="header">Limit Amount</f:facet>
                    #{b.limitAmount}
                </h:column>
                <h:column>
                    <f:facet name="header">Month</f:facet>
                    #{b.month}
                </h:column>
                <h:column>
                    <f:facet name="header">Year</f:facet>
                    #{b.year}
                </h:column>
                <h:column>
                    <f:facet name="header">Actions</f:facet>
                    <h:commandLink value="Edit" action="#{budgetBean.editBudget(b)}" />
                    &#160;|&#160;
                    <h:commandLink value="Delete" action="#{budgetBean.deleteBudget(b)}"
                                   onclick="return confirm('Delete this budget?');" />
                </h:column>
            </h:dataTable>
        </h:form>
    </div>

</h:body>
</html>
