<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Budget Form — FinTrack</title>
    <h:outputStylesheet library="css" name="styles.css" />
</h:head>
<h:body>

    <nav class="navbar">
        <div class="nav-brand">💰 FinTrack</div>
        <div class="nav-links">
            <h:form styleClass="nav-form">
                <h:commandLink value="Home" action="index" styleClass="nav-link" />
                <h:commandLink value="Transactions" action="transactionList" styleClass="nav-link" />
                <h:commandLink value="Budgets" action="budgetList" styleClass="nav-link" />
            </h:form>
        </div>
    </nav>

    <div class="form-wrapper">
        <div class="form-card">
            <h2>
                <h:outputText value="Edit Budget" rendered="#{budgetBean.editMode}" />
                <h:outputText value="Add Budget" rendered="#{!budgetBean.editMode}" />
            </h2>

            <h:form>
                <div class="form-group">
                    <label>Category</label>
                    <h:inputText value="#{budgetBean.category}" required="true"
                                 requiredMessage="Category is required" />
                </div>
                <div class="form-group">
                    <label>Limit Amount</label>
                    <h:inputText value="#{budgetBean.limitAmount}" required="true"
                                 requiredMessage="Limit amount is required">
                        <f:validateDoubleRange minimum="0.01" />
                    </h:inputText>
                </div>
                <div class="form-group">
                    <label>Month (1–12)</label>
                    <h:inputText value="#{budgetBean.month}" required="true"
                                 requiredMessage="Month is required">
                        <f:validateLongRange minimum="1" maximum="12" />
                    </h:inputText>
                </div>
                <div class="form-group">
                    <label>Year</label>
                    <h:inputText value="#{budgetBean.year}" required="true"
                                 requiredMessage="Year is required">
                        <f:validateLongRange minimum="2020" maximum="2100" />
                    </h:inputText>
                </div>

                <div style="margin-top:28px; display:flex; gap:10px; flex-wrap:wrap;">
                    <h:commandButton value="Save Budget" action="#{budgetBean.saveBudget}"
                                     styleClass="home-btn" style="background:#10b981;" />
                    <h:commandButton value="Cancel" action="#{budgetBean.cancelEdit}" immediate="true" styleClass="home-btn"
                                     style="background:#6b7280;" />
                    <h:commandLink value="← Back to Home" action="index" immediate="true" styleClass="home-btn"
                                   style="background:transparent; color:#4f46e5; border:2px solid #4f46e5;" />
                </div>

                <h:messages styleClass="messages" />
            </h:form>
        </div>
    </div>

</h:body>
</html>
